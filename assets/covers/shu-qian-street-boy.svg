<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-label="署前街少年 by 赵雷">
  <defs>
    <linearGradient id="street" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dad0bb"/>
      <stop offset=".48" stop-color="#8a816f"/>
      <stop offset="1" stop-color="#2d2b25"/>
    </linearGradient>
    <filter id="noise">
      <feTurbulence baseFrequency=".7" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .16"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="900" height="900" fill="url(#street)"/>
  <rect width="900" height="900" filter="url(#noise)" opacity=".55"/>
  <path d="M0 588 H900 V900 H0 Z" fill="#25231e" opacity=".8"/>
  <path d="M92 548 C210 506 318 514 430 548 C560 586 682 580 808 528" fill="none" stroke="#f4e8cf" stroke-width="12" opacity=".34"/>
  <rect x="370" y="318" width="110" height="250" rx="54" fill="#3a3028"/>
  <circle cx="425" cy="268" r="58" fill="#6f5842"/>
  <path d="M292 612 L560 612" stroke="#d8c19e" stroke-width="10" opacity=".58"/>
  <text x="72" y="118" fill="#f7ecd8" font-family="Arial, sans-serif" font-size="82" font-weight="900">署前街少年</text>
  <text x="78" y="180" fill="#f7ecd8" font-family="Arial, sans-serif" font-size="36" font-weight="800" letter-spacing="10">ZHAO LEI</text>
</svg>
