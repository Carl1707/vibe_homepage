<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-label="The Beginning by Flawed Mangoes">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6f2ff"/>
      <stop offset=".52" stop-color="#8ec7d8"/>
      <stop offset="1" stop-color="#20344c"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .18"/>
      </feComponentTransfer>
      <feBlend mode="overlay" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="900" height="900" fill="url(#sky)"/>
  <g filter="url(#grain)">
    <circle cx="710" cy="172" r="84" fill="#fff7d4" opacity=".78"/>
    <path d="M0 608 C190 520 312 616 486 544 C632 482 742 530 900 456 L900 900 L0 900 Z" fill="#132132" opacity=".88"/>
    <path d="M0 674 C170 610 328 702 500 642 C682 578 762 624 900 578 L900 900 L0 900 Z" fill="#07121d" opacity=".9"/>
    <path d="M232 702 C280 620 346 580 420 546" stroke="#d9eef8" stroke-width="8" fill="none" opacity=".42"/>
    <text x="82" y="104" fill="#0f2635" font-family="Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="6">FLAWED MANGOES</text>
    <text x="82" y="170" fill="#ffffff" font-family="Arial, sans-serif" font-size="72" font-weight="900">THE BEGINNING</text>
  </g>
</svg>
